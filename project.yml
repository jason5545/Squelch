# xcodegen 設定。`make build` 會先跑 xcodegen generate，Squelch.xcodeproj 不進 git。
name: Squelch
options:
  bundleIdPrefix: io.github.jason5545
  developmentLanguage: zh-Hant
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: MW4GWYGX56
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  Squelch:
    type: application
    platform: macOS
    sources:
      - path: Sources/Squelch
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Squelch
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jason5545.Squelch
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Squelch
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # 要用 Process 執行 Homebrew 的 yt-dlp，不開 App Sandbox。
        ENABLE_APP_SANDBOX: NO
