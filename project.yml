# xcodegen 設定。`make build` 會先跑 xcodegen generate，Squelch.xcodeproj 不進 git。
name: Squelch
options:
  bundleIdPrefix: io.github.jason5545
  # 字串的原文是正體中文（Localizable.xcstrings 的 sourceLanguage）；開發地區設成英文，
  # 系統語言不是中英日時退回英文。
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: MW4GWYGX56
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Squelch:
    type: application
    platform: macOS
    sources:
      - path: Sources/Squelch
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    # 其他鍵由 GENERATE_INFOPLIST_FILE 產生，這份只放它產生不了的 URL scheme（squelch://add?channel=@handle）。
    info:
      path: Resources/Info.plist
      properties:
        # xcodegen 預設寫死 1.0／1，改成跟著 release.sh 帶進來的版本號。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: io.github.jason5545.Squelch
            CFBundleURLSchemes: [squelch]
    settings:
      base:
        PRODUCT_NAME: Squelch
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jason5545.Squelch
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Squelch
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # 要用 Process 執行 App 內建（或自動更新下載）的 yt-dlp，不開 App Sandbox。
        ENABLE_APP_SANDBOX: NO
    postBuildScripts:
      # yt-dlp 和 deno 包進 Contents/Helpers，不用另外裝 Homebrew。版本寫在 scripts/vendor-tools.sh。
      - name: Embed yt-dlp and deno
        script: '"$SRCROOT/scripts/embed-tools.sh"'
        basedOnDependencyAnalysis: false
